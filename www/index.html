<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<style>

}

}

}	

.input-area{

flex:1;
padding:14px;

}

button{
padding:14px 20px;
border:none;
border-radius:12px;
background:#2563eb;

font-size:16px;
}
body{
    margin:0;
    display:flex;
    height:100vh;
    background:#020617;
    color:white;
    font-family:Arial;
}

.sidebar{
    width:260px;
    background:#0f172a;
    padding:10px;
    overflow-y:auto;
}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

.chat-btn{
    width:100%;
    margin-bottom:8px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}
.ai pre{
    background:#020617;
    padding:12px;
    border-radius:12px;
    overflow-x:auto;
    margin-top:10px;
}

.ai code{
    font-family:monospace;
    color:#38bdf8;
}

.ai h1,
.ai h2,
.ai h3{
    margin-top:10px;
    margin-bottom:10px;
}

.ai ul,
.ai ol{
    padding-left:20px;
}

    margin:8px 0;

</style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
</script>

</head>

<body>

<div style="padding:10px;background:#0f172a;">
    <button id="newChatBtn">Новый чат</button>
</div>

<div class="header">
Quantum AI
</div>

<div id="chatList" style="
padding:10px;
background:#111827;
display:flex;
flex-wrap:wrap;
gap:10px;
">
</div>

<div id="chat"></div>

<div class="input-area">
<input id="input" placeholder="Напиши сообщение">
<button id="send">Send</button>
</div>

<script>


window.onload = async function(){

const chat = document.getElementById("chat");

const input = document.getElementById("input");

const sendBtn = document.getElementById("send");

let currentChatId = null;

async function loadChats(){

    const response = await fetch(
        "https://quantumai-app.onrender.com/chats"
    );

    const chats = await response.json();

    const chatList =
        document.getElementById("chatList");

    chatList.innerHTML = "";

chats.reverse().forEach(chatItem => {

    const btn =
        document.createElement("button");

    btn.innerText =
        chatItem.title + " #" + chatItem.id;

    btn.onclick = async () => {

        currentChatId = chatItem.id;

        await loadMessages(chatItem.id);

    };

    const deleteBtn =
        document.createElement("button");

    deleteBtn.innerText = "🗑";

    deleteBtn.style.marginLeft = "5px";

    deleteBtn.onclick = async (e) => {

        e.stopPropagation();

        await fetch(
            `https://quantumai-app.onrender.com/delete_chat/${chatItem.id}`,
            {
                method: "DELETE"
            }
        );

        await loadChats();

    };

    const row =
        document.createElement("div");

    row.appendChild(btn);

    row.appendChild(deleteBtn);

    chatList.appendChild(row);

});

}

async function createChat(){

const response = await fetch(
"https://quantumai-app.onrender.com/new_chat",
{
method:"POST"
}
);

const data = await response.json();

currentChatId = data.chat_id;

console.log(currentChatId);

}

try {
  await createChat();
await loadChats();
} catch (e) {
  console.log("createChat error", e);
}

sendBtn.addEventListener("click", async function(){

const text = input.value;

if(text.trim() === "") return;

const userDiv = document.createElement("div");

userDiv.className = "user";

userDiv.innerText = text;

chat.appendChild(userDiv);

input.value = "";

const aiDiv = document.createElement("div");

aiDiv.className = "ai";

chat.appendChild(aiDiv);

try {

const response = await fetch(
"https://quantumai-app.onrender.com/chat",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:text,
chat_id:currentChatId
})
}
);


const result = await response.text();

aiDiv.innerHTML = marked.parse(result);

await loadChats();

chat.scrollTop = chat.scrollHeight;

}catch(error){

console.log(error);

aiDiv.innerHTML = "Error: " + error;

}

});

document
.getElementById("newChatBtn")
.addEventListener("click", async () => {

    await createChat();

    await loadChats();

});

async function loadMessages(chatId){

    const response = await fetch(
        `https://quantumai-app.onrender.com/messages/${chatId}`
    );

    const messages = await response.json();

    chat.innerHTML = "";

    messages.forEach(msg => {

        const div = document.createElement("div");

        div.className =
            msg.role === "user"
            ? "user"
            : "ai";

        if(msg.role === "assistant"){
    div.innerHTML = marked.parse(msg.content);
}else{
    div.innerText = msg.content;
}

        chat.appendChild(div);

    });

}

};
</script>

</body>
</html>
