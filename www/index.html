<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum AI</title>

<style>

body{
margin:0;
font-family:Arial;
background:#020617;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
background:#0f172a;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;

}

.message{
padding:12px;
border-radius:14px;
max-width:80%;
word-wrap:break-word;
}

.user{
background:#2563eb;
align-self:flex-end;
}

.ai{
background:#111827;
align-self:flex-start;
line-height:1.6;
}

.ai pre{
background:#020617;

}

.ai code{
font-family:monospace;

.ai ul{
padding-left:20px;
}

.ai h1,.ai h2,.ai h3{

}	

.input-area{

padding:10px;

input{

}

button{
padding:14px 20px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;

}

</style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
</script>

</head>

<body>

<div class="header">
Quantum AI
</div>

<div id="chat"></div>

<div class="input-area">
<input id="message" placeholder="Напиши сообщение">
<button onclick="sendMessage()">Send</button>
</div>

<script>

let currentChatId = null;

async function createChat(){

const response = await fetch(
"https://quantumai-app.onrender.com/new_chat",
{
method:"POST"
}
);

const data = await response.json();

currentChatId = data.chat_id;

console.log("CHAT ID:", currentChatId);

}

const chat = document.getElementById("chat");

const input = document.getElementById("input");

const sendBtn = document.getElementById("send");

createChat();

sendBtn.onclick = async () => {

if(!currentChatId){

await createChat();

}

const text = input.value;

if(!text) return;

const userDiv = document.createElement("div");

userDiv.className = "user";

userDiv.innerText = text;

chat.appendChild(userDiv);

input.value = "";

const aiDiv = document.createElement("div");

aiDiv.className = "ai";

chat.appendChild(aiDiv);

try{

const response = await fetch(
"https://quantumai-app.onrender.com/chat",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:text,
chat_id: currentChatId
})
}
);

console.log(response);

const reader = response.body.getReader();

const decoder = new TextDecoder();

while(true){

const {done, value} = await reader.read();

if(done) break;

const chunk = decoder.decode(value);

aiDiv.innerHTML += chunk;

chat.scrollTop = chat.scrollHeight;

}

aiDiv.innerHTML = marked.parse(aiDiv.innerHTML);

saveChat();

}catch(error){

console.log(error);

aiDiv.innerHTML = "Error";

}

};

</script>
</body>
</html>
