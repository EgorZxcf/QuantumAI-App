<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum AI</title>

<style>

body{
margin:0;
font-family:Arial;
background:#020617;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
background:#0f172a;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.message{
padding:12px;
border-radius:14px;
max-width:80%;
word-wrap:break-word;
}

.user{
background:#2563eb;
align-self:flex-end;
}

.ai{
background:#111827;
align-self:flex-start;
line-height:1.6;
}

.ai pre{
background:#020617;
padding:12px;
border-radius:12px;
overflow-x:auto;
margin-top:10px;
}

.ai code{
font-family:monospace;
color:#38bdf8;
}

.ai ul{
padding-left:20px;
}

.ai h1,.ai h2,.ai h3{
margin-top:10px;
}	

.input-area{
display:flex;
padding:10px;
gap:10px;
background:#0f172a;
}

input{
flex:1;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
}

button{
padding:14px 20px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:16px;
}

</style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
</script>

</head>

<body>

<div style="padding:10px;background:#0f172a;">
    <button id="newChatBtn">Новый чат</button>
</div>

<div class="header">
Quantum AI
</div>

<div id="chatList" style="
padding:10px;
background:#111827;
max-height:150px;
overflow-y:auto;
">
</div>

<div id="chat"></div>

<div class="input-area">
<input id="input" placeholder="Напиши сообщение">
<button id="send">Send</button>
</div>

<script>


window.onload = async function(){

const chat = document.getElementById("chat");

const input = document.getElementById("input");

const sendBtn = document.getElementById("send");

let currentChatId = null;

async function loadChats(){

    const response = await fetch(
        "https://quantumai-app.onrender.com/chats"
    );

    const chats = await response.json();

    const chatList =
        document.getElementById("chatList");

    chatList.innerHTML = "";

     chats.reverse().forEach(chatItem => {

        const btn =
            document.createElement("button");

        btn.innerText =
            chat.title + " #" + chat.id;

        btn.style.margin = "5px";

btn.onclick = async () => {

    currentChatId = chat.id;

    await loadMessages(chat.id);

        };

        chatList.appendChild(btn);

    });

}

async function createChat(){

const response = await fetch(
"https://quantumai-app.onrender.com/new_chat",
{
method:"POST"
}
);

const data = await response.json();

currentChatId = data.chat_id;

console.log(currentChatId);

}

try {
  await createChat();
await loadChats();
} catch (e) {
  console.log("createChat error", e);
}

sendBtn.addEventListener("click", async function(){

const text = input.value;

if(text.trim() === "") return;

const userDiv = document.createElement("div");

userDiv.className = "user";

userDiv.innerText = text;

chat.appendChild(userDiv);

input.value = "";

const aiDiv = document.createElement("div");

aiDiv.className = "ai";

chat.appendChild(aiDiv);

try {

const response = await fetch(
"https://quantumai-app.onrender.com/chat",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:text,
chat_id:currentChatId
})
}
);

const result = await response.text();

aiDiv.innerHTML = result;

chat.scrollTop = chat.scrollHeight;

}catch(error){

console.log(error);

aiDiv.innerHTML = "Error: " + error;

}

});

document
.getElementById("newChatBtn")
.addEventListener("click", async () => {

    await createChat();

    await loadChats();

});

async function loadMessages(chatId){

    const response = await fetch(
        `https://quantumai-app.onrender.com/messages/${chatId}`
    );

    const messages = await response.json();

    chat.innerHTML = "";

    messages.forEach(msg => {

        const div = document.createElement("div");

        div.className =
            msg.role === "user"
            ? "user"
            : "ai";

        div.innerHTML = msg.content;

        chat.appendChild(div);

    });

}

};
</script>

</body>
</html>
