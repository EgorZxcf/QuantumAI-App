<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum AI</title>

<style>

body{
margin:0;
font-family:Arial;
background:#020617;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
background:#0f172a;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.message{
padding:12px;
border-radius:14px;
max-width:80%;
word-wrap:break-word;
}

.user{
background:#2563eb;
align-self:flex-end;
}

.ai{
background:#111827;
align-self:flex-start;
line-height:1.6;
}

.ai pre{
background:#020617;
padding:12px;
border-radius:12px;
overflow-x:auto;
margin-top:10px;
}

.ai code{
font-family:monospace;
color:#38bdf8;
}

.ai ul{
padding-left:20px;
}

.ai h1,.ai h2,.ai h3{
margin-top:10px;
}	

.input-area{
display:flex;
padding:10px;
gap:10px;
background:#0f172a;
}

input{
flex:1;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
}

button{
padding:14px 20px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:16px;
}

</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
</script>
</head>

<body>

<div class="header">
Quantum AI
</div>

<div id="chat"></div>

<div class="input-area">
<input id="message" placeholder="Напиши сообщение">
<button onclick="sendMessage()">Send</button>
</div>

<script>

const chat = document.getElementById("chat");
  function saveChat(){

localStorage.setItem(
"quantum_chat",
chat.innerHTML
);

}

function loadChat(){

const saved = localStorage.getItem(
"quantum_chat"
);

if(saved){

chat.innerHTML = saved;

chat.scrollTop = chat.scrollHeight;

}

}

loadChat();

async function sendMessage(){

const input = document.getElementById("message");

const text = input.value.trim();

if(!text,) return;

const userDiv = document.createElement("div");
userDiv.className = "message user";
userDiv.innerText = text;
chat.appendChild(userDiv);

saveChat();

input.value = "";

try{

const response = await fetch(
"https://quantumai-app.onrender.com/chat",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:text
})
}
);

const data = await response.json();

const aiDiv = document.createElement("div");
aiDiv.className = "message ai";
aiDiv.innerText = data.response;

errorDiv.className = "message ai";

chat.appendChild(errorDiv);

}

</script>

</body>
</html>
